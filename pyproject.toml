[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfe"
version = "0.1.0"
description = "News-Market Platform : corrélation actualités financières / dynamiques boursières"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pandas==2.1.2", "numpy>=1.26", "scipy>=1.11", "requests>=2.31", "tenacity>=8.2",
  "pandas-market-calendars>=4.4", "datasketch>=1.6", "yfinance>=0.2.40", "praw>=7.7",
  "apache-airflow-providers-databricks==6.8.0","python-dotenv>=1.0", "pyyaml>=6.0",
]

[project.optional-dependencies]
stream = ["alpaca-py>=0.30", "confluent-kafka>=2.4"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "statsmodels>=0.14", "mlflow>=2.14",
      "transformers>=4.41", "torch>=2.2"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-requests"]

[project.scripts]
pfe = "pfe.cli:main"
pfe-stream = "pfe.streaming.streamer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
ignore_missing_imports = true
