# Databricks Asset Bundle — déploiement as-code (dev / staging / prod)
bundle:
  name: pfe

variables:
  catalog: {default: pfe_dev}
  warehouse_id: {description: "02c55b837849b8af"}
  kafka_bootstrap: {default: "adb-7405616503111862.servicebus.windows.net:9093"}
  alert_email: {default: "jmnvekounou@gmail.com"}
  sp_application_id: {default: "c35f6c00-9693-4ec5-90f5-7554cf37e15c"}
  catalog: {default: pfe_dev}
  tickers: {default: "AAPL,MSFT,NVDA,TSLA,AMZN"}

artifacts:
  pfe_wheel:
    type: whl
    build: python -m build --wheel
    path: .

include: ["resources/*.yml"]

targets:
  dev:
    mode: development
    default: true
    workspace: 
      host: "https://adb-7405616503111862.2.azuredatabricks.net"
    variables: 
      catalog: pfe_dev
  staging:
    workspace: {host: "https://adb-7405616503111862.2.azuredatabricks.net", root_path: /Shared/.bundle/pfe/staging}
    variables: {catalog: pfe_stg}
  prod:
    mode: production
    workspace: {host: "https://adb-7405616503111862.2.azuredatabricks.net", root_path: /Shared/.bundle/pfe/prod}
    variables: {catalog: pfe_prod}
    run_as: {service_principal_name: "${var.sp_application_id}"}
