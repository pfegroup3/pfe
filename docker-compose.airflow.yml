# Usage : docker compose -f docker-compose.airflow.yml up -d  -> http://localhost:8081 (admin / admin en local)
name: pfe-airflow
x-airflow: &airflow
  build: .
#  image: apache/airflow:2.9.3-python3.11
  environment: &env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    PFE_ENV: ${PFE_ENV:-dev}
    # Connexion Databricks (service principal / PAT) -> en prod : Azure Key Vault backend
    AIRFLOW_CONN_DATABRICKS_DEFAULT: ${AIRFLOW_CONN_DATABRICKS_DEFAULT:-databricks://:@adb-XXXX.azuredatabricks.net?token=CHANGE_ME}
#    _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-databricks>=6.7
  volumes: ["./airflow/dags:/opt/airflow/dags"]
  depends_on: {postgres: {condition: service_healthy}}

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 10}
    volumes: [pgdata:/var/lib/postgresql/data]

  airflow-init:
    <<: *airflow
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com || true"
    restart: "no"

  webserver:
    <<: *airflow
    command: webserver
    ports: ["8081:8080"]
    depends_on: {airflow-init: {condition: service_completed_successfully}}
    restart: unless-stopped

  scheduler:
    <<: *airflow
    command: scheduler
    depends_on: {airflow-init: {condition: service_completed_successfully}}
    restart: unless-stopped

volumes: {pgdata: {}}
