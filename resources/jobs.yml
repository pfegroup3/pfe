resources:
  pipelines:
    stream_pipeline:
      name: pfe-stream-${bundle.target}
      catalog: ${var.catalog}
      target: silver
      serverless: true
      continuous: true
      libraries:
        - file:
            path: ../src/pfe/pipelines/dlt_stream.py
      configuration:
        kafka.bootstrap: "${var.kafka_bootstrap}"
        kafka.sasl: "true"
        secret.scope: pfe
 
  # Planification déléguée à Airflow (airflow/dags) : schedules Databricks en PAUSED.
  jobs:
    init_schema:
      name: pfe-init-${bundle.target}
      tasks:
        - task_key: ops
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/00_ops/001_schemas_ops.sql
            parameters:
              catalog: "${var.catalog}"
        - task_key: vault
          depends_on:
            - task_key: ops
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/010_raw_vault.sql
            parameters:
              catalog: "${var.catalog}"
        - task_key: bv
          depends_on:
            - task_key: vault
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/02_business_vault/020_business_vault.sql
            parameters:
              catalog: "${var.catalog}"
        - task_key: gold
          depends_on:
            - task_key: bv
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/03_gold/030_gold.sql
            parameters:
              catalog: "${var.catalog}"
 
    batch_ingest:
      name: pfe-batch-ingest-${bundle.target}
      schedule:
        quartz_cron_expression: "0 */5 * * * ?"   # toutes les 5 min
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
        - environment_key: ml
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
              - "transformers>=4.41"
              - torch
      tasks:
        - task_key: finnhub
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [ingest, --source, finnhub_news]
        - task_key: alpaca_news
          environment_key: default
          max_retries: 2
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [ingest, --source, alpaca_news]
        - task_key: sec_8k
          environment_key: default
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [ingest, --source, sec_8k]
        - task_key: bars_backfill
          environment_key: default
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [ingest, --source, alpaca_bars_1m]
        - task_key: enrich
          environment_key: ml
          depends_on:
            - task_key: finnhub
            - task_key: alpaca_news
            - task_key: sec_8k
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [enrich]
        - task_key: health
          environment_key: default
          depends_on:
            - task_key: enrich
          run_if: ALL_DONE
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [health]
 
    daily_batch:
      name: pfe-daily-${bundle.target}
      schedule:
        quartz_cron_expression: "0 30 22 ? * MON-FRI"
        timezone_id: America/New_York
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: yahoo
          environment_key: default
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [ingest, --source, yahoo_daily, --lookback-days, "7"]
        - task_key: gdelt
          environment_key: default
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [ingest, --source, gdelt]
        - task_key: finnhub_sent
          environment_key: default
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [ingest, --source, finnhub_sentiment]
 
    train_models:
      name: pfe-train-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 3 ? * SUN"
        timezone_id: UTC
        pause_status: PAUSED
      environments:
        - environment_key: ml
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
              - "transformers>=4.41"
              - torch
      tasks:
        - task_key: train
          environment_key: ml
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: [train]
