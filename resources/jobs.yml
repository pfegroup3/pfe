    batch_ingest:
      name: pfe-batch-ingest-${bundle.target}
      schedule: {quartz_cron_expression: "0 */15 * * * ?", timezone_id: UTC, pause_status: UNPAUSED}
      max_concurrent_runs: 1
      queue: {enabled: true}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      environments:
        - environment_key: pfe_env
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
              - "transformers>=4.41"
              - torch
      tasks:
        - task_key: finnhub
          environment_key: pfe_env
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", "--tickers", "${var.tickers}", ingest, --source, finnhub_news]
        - task_key: alpaca_news
          environment_key: pfe_env
          max_retries: 2
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", "--tickers", "${var.tickers}", ingest, --source, alpaca_news]
        - task_key: sec_8k
          environment_key: pfe_env
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", "--tickers", "${var.tickers}", ingest, --source, sec_8k]
        - task_key: bars_backfill
          environment_key: pfe_env
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", "--tickers", "${var.tickers}", ingest, --source, alpaca_bars_1m]
        - task_key: vault_load
          depends_on: [{task_key: finnhub}, {task_key: alpaca_news}, {task_key: sec_8k}, {task_key: bars_backfill}]
          run_if: AT_LEAST_ONE_SUCCESS
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file: {path: ../sql/01_vault/011_raw_vault_load.sql}
            parameters: {catalog: "${var.catalog}"}
        - task_key: enrich
          environment_key: pfe_env
          depends_on: [{task_key: vault_load}]
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", enrich]
        - task_key: health
          environment_key: pfe_env
          depends_on: [{task_key: enrich}]
          run_if: ALL_DONE
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", health]

    daily_batch:
      name: pfe-daily-${bundle.target}
      schedule: {quartz_cron_expression: "0 30 22 ? * MON-FRI", timezone_id: America/New_York, pause_status: UNPAUSED}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      environments:
        - environment_key: pfe_env
          spec:
            environment_version: "2"
            dependencies: [../dist/*.whl]
      tasks:
        - task_key: yahoo
          environment_key: pfe_env
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", "--tickers", "${var.tickers}", ingest, --source, yahoo_daily, --lookback-days, "7"]
        - task_key: gdelt
          environment_key: pfe_env
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", "--tickers", "${var.tickers}", ingest, --source, gdelt]
        - task_key: finnhub_sent
          environment_key: pfe_env
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", "--tickers", "${var.tickers}", ingest, --source, finnhub_sentiment]

    train_models:
      name: pfe-train-${bundle.target}
      schedule: {quartz_cron_expression: "0 0 3 ? * SUN", timezone_id: UTC, pause_status: UNPAUSED}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      environments:
        - environment_key: ml_env
          spec:
            environment_version: "2"
            dependencies: [../dist/*.whl, scikit-learn, xgboost, statsmodels, mlflow]
      tasks:
        - task_key: train
          environment_key: ml_env
          python_wheel_task:
            package_name: pfe
            entry_point: pfe
            parameters: ["--catalog", "${var.catalog}", train]